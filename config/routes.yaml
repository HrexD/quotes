# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

# Routes explicites pour le QuoteController
app_home:
    path: /
    controller: App\Controller\QuoteController::home

app_quotes:
    path: /quotes
    controller: App\Controller\QuoteController::quotes

app_about:
    path: /about
    controller: App\Controller\QuoteController::about

app_add_quote:
    path: /add
    controller: App\Controller\QuoteController::add

# Chargement des contrôleurs avec des attributs
controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
